<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación con Zod</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Importar Zod desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/zod@3.21.4/lib/index.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <h1>Registro de Usuario</h1>
      <p class="subtitle">Completa el formulario para crear tu cuenta</p>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Nombre completo:</label>
          <input 
            type="text" 
            id="name" 
            placeholder="Ej: Juan Pérez" 
            autocomplete="name"
          />
          <span class="error-message" id="error-name"></span>
        </div>
        
        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input 
            type="email" 
            id="email" 
            placeholder="ejemplo@correo.com" 
            autocomplete="email"
          />
          <span class="error-message" id="error-email"></span>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Mínimo 6 caracteres" 
            autocomplete="new-password"
          />
          <span class="error-message" id="error-password"></span>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña:</label>
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Repite tu contraseña" 
            autocomplete="new-password"
          />
          <span class="error-message" id="error-confirmPassword"></span>
        </div>
        
        <div class="form-group">
          <label for="age">Edad:</label>
          <input 
            type="number" 
            id="age" 
            placeholder="Debe ser mayor de 18 años"
            min="18"
            max="100"
          />
          <span class="error-message" id="error-age"></span>
        </div>
        
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="terms" />
            <span>Acepto los términos y condiciones</span>
          </label>
          <span class="error-message" id="error-terms"></span>
        </div>
        
        <button type="submit" class="submit-btn">Registrar</button>
      </form>
      
      <div id="errors" class="errors-container"></div>
    </div>
    
    <!-- Modal de éxito -->
    <div id="successModal" class="modal">
      <div class="modal-content success">
        <div class="success-icon">✓</div>
        <h2>¡Registro Exitoso!</h2>
        <p>Tu cuenta ha sido creada correctamente.</p>
        <div id="userData"></div>
        <button id="closeModal" class="modal-btn">Aceptar</button>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
